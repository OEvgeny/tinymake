name: Publish npm Release from releases.yml

on:
  push:
    branches:
      - main
    paths:
      - releases.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Read releases.yml for next release
        id: rel
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, subprocess

          try:
            import yaml  # type: ignore
          except Exception:
            subprocess.check_call([sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "pyyaml"])
            import yaml  # type: ignore

          from pathlib import Path

          p = Path("releases.yml")
          if not p.exists():
            print("releases.yml not found", file=sys.stderr)
            sys.exit(1)

          data = yaml.safe_load(p.read_text("utf-8"))
          entries = data.get("releases") if isinstance(data, dict) else None

          if not isinstance(entries, list) or not entries:
            print("releases.yml must contain a non-empty releases: list.", file=sys.stderr)
            sys.exit(1)

          def norm_entry(e):
            if not isinstance(e, dict):
              return None
            version = e.get("version")
            desc = e.get("description") or ""
            rname = e.get("release-name") or e.get("release_name") or ""
            tag = e.get("tag") or ""
            return {
              "version": str(version).strip() if version is not None else "",
              "description": str(desc).strip(),
              "release_name": str(rname).strip(),
              "tag": str(tag).strip(),
            }

          cleaned = [norm_entry(e) for e in entries]
          cleaned = [e for e in cleaned if e and e["version"]]
          if not cleaned:
            print("No valid entries with 'version' found in releases.yml.", file=sys.stderr)
            sys.exit(1)

          chosen = cleaned[0]
          tag = chosen["tag"] or f"v{chosen['version']}"

          def tag_exists(tagname: str) -> bool:
            r1 = subprocess.run(
              ["git", "rev-parse", "-q", "--verify", f"refs/tags/{tagname}"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
            )
            if r1.returncode == 0:
              return True

            r2 = subprocess.run(
              ["git", "ls-remote", "--tags", "origin", tagname],
              capture_output=True,
              text=True,
            )
            return bool(r2.stdout.strip())

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
            if tag_exists(tag):
              f.write("should_publish=false\n")
            else:
              f.write("should_publish=true\n")
            f.write(f"tag={tag}\n")
            f.write(f"version={chosen['version']}\n")
            f.write(f"release_name={chosen['release_name']}\n")
            f.write("description<<EOF\n" + chosen["description"] + "\nEOF\n")

          if tag_exists(tag):
            print(f"Tag {tag} already exists. Nothing to do.")
          else:
            print(f"Will publish {tag}")
          PY

      - name: Stop early if already published
        if: steps.rel.outputs.should_publish != 'true'
        run: echo "No new release to publish."

      - name: Validate package.json
        if: steps.rel.outputs.should_publish == 'true'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const missing = [];

          if (!pkg.name) missing.push('name');
          if (!pkg.version) missing.push('version');
          if (pkg.type !== 'module') missing.push('type=module');
          if (!pkg.bin || !Object.keys(pkg.bin).length) missing.push('bin');

          if (missing.length) {
            console.error(`package.json is missing required fields: ${missing.join(', ')}`);
            process.exit(1);
          }
          JS

      - name: Stamp package version from releases.yml
        if: steps.rel.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';

          const version = process.env.VERSION;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log(`Stamped package.json version=${version}`);
          JS

      - name: Pack npm tarball
        if: steps.rel.outputs.should_publish == 'true'
        id: pack
        shell: bash
        run: |
          mkdir -p _release_artifacts
          PACK_JSON="$(npm pack --json --pack-destination _release_artifacts)"
          echo "${PACK_JSON}"
          PACKAGE_FILE="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x[0].filename)' "${PACK_JSON}")"
          echo "package_file=_release_artifacts/${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"
          ls -la _release_artifacts

      - name: Publish package to npm
        # if: steps.rel.outputs.should_publish == 'true'
        if: false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          npm publish "${{ steps.pack.outputs.package_file }}"

      - name: Prepare git identity
        if: steps.rel.outputs.should_publish == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: steps.rel.outputs.should_publish == 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        shell: bash
        run: |
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        if: steps.rel.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          TITLE: ${{ steps.rel.outputs.release_name }}
        shell: bash
        run: |
          if [ -z "${TITLE}" ]; then
            TITLE="${TAG}"
          fi

          cat > _release_notes.md <<'__NOTES__'
          ${{ steps.rel.outputs.description }}
          __NOTES__

          gh release create "${TAG}" \
            --title "${TITLE}" \
            --notes-file _release_notes.md \
            --target "${{ github.sha }}" \
            --verify-tag \
            "${{ steps.pack.outputs.package_file }}"
